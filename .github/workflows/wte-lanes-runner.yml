name: WTE lanes public runner
on:
  push:
    branches: [wte-lanes-runner]
  pull_request:
    branches: [main]
    types: [ready_for_review]
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bundle]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wte-lanes-runner
      - name: Fetch frozen P0 contract
        run: |
          set -euo pipefail
          rm -f /tmp/wte-contract.json
          if ! curl -sS --fail-with-body --retry 6 --retry-all-errors --retry-delay 2 \
            'https://lpouhhkxgevpiwyzcsdg.supabase.co/functions/v1/migration-content-p0-export' \
            -o /tmp/wte-contract.json; then
            echo '--- export error body ---'
            cat /tmp/wte-contract.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/wte-contract.json'))
          assert d.get('version')=='migration_content_p0_v3'
          assert len(d.get('pages',[]))==97
          print('export',d.get('version'),'pages=',len(d['pages']))
          PY
      - name: Generate frozen WTE lanes bundle
        run: |
          set -euo pipefail
          rm -rf out bundle
          mkdir -p bundle
          python3 generate_wte_lanes.py \
            --contract /tmp/wte-contract.json \
            --out-dir out/lanes \
            --emit-tree bundle/tree.ndjson
          test "$(find out/lanes -name index.html | wc -l | tr -d ' ')" = 97
          test "$(wc -l < bundle/tree.ndjson | tr -d ' ')" = 100
          rm -rf out2
          python3 generate_wte_lanes.py --contract /tmp/wte-contract.json --out-dir out2/lanes
          diff -qr out/lanes out2/lanes
          split -l 8 -d -a 2 bundle/tree.ndjson bundle/chunk-
          test "$(find bundle -maxdepth 1 -name 'chunk-*' | wc -l | tr -d ' ')" = 13
      - name: Commit transfer bundle
        run: |
          set -euo pipefail
          git config user.name 'WTE lanes compute'
          git config user.email 'wte-lanes-compute@users.noreply.github.com'
          git add bundle
          if ! git diff --cached --quiet; then
            git commit -m 'build hardened WTE lanes transfer bundle [bundle]'
            git push origin HEAD:wte-lanes-runner
          fi
